version: '3.8'

services:
  hanime-server:
    image: ghcr.io/patchourinya/hanime-server:latest
    container_name: hanime-server
    ports:
      - "7788:7788"
    volumes:
      - ./data:/app/backend/data
      - ./downloads:/app/backend/downloads
    environment:
      - TZ=Asia/Shanghai
      - USE_PROXY=false
      - PROXY_URL=
      - PYTHONOPTIMIZE=2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7788/"]
      interval: 30s
      timeout: 10s
      retries: 3
