services:
  app:
    build: .
    image: heisenyu/hanime-server:latest
    container_name: hanime-server
    restart: unless-stopped
    environment:
      - USE_PROXY=${USE_PROXY:-false}
      - PROXY_URL=${PROXY_URL:-}
      - MYSQL_HOST=${MYSQL_HOST:-127.0.0.1}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-librarydream}
      - USE_MINIO=${USE_MINIO:-false}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-127.0.0.1:9001}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-hanime}
      - PYTHONOPTIMIZE=2
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # 挂载一个目录即可持久化所有用户数据（数据库、下载文件、封面）
      - ./data:/app/backend/data
    ports:
      - "7788:7788"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'