services:
  app:
    build: .
    image: heisenyu/hanime-server:latest
    container_name: hanime-server
    restart: unless-stopped
    environment:
      - USE_PROXY=${USE_PROXY:-false}
      - PROXY_URL=${PROXY_URL:-}
      - PYTHONOPTIMIZE=2
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # 挂载一个目录即可持久化所有用户数据（数据库、下载文件、封面）
      - ./data:/app/backend/data
    ports:
      - "7788:7788"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'